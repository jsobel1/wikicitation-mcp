[project]
name = "wikicitation-mcp"
version = "0.5.0"
description = "MCP server providing Wikipedia citation-science tools for Claude -- pure Python, no R required"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jonathan Sobel", email = "jsobel83@gmail.com" },
]
keywords = [
    "mcp", "wikipedia", "citations", "bibliometrics",
    "claude", "llm", "wikitext", "doi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.25",
    "mwparserfromhell>=0.6",
]

[project.urls]
Homepage = "https://github.com/jsobel1/wikicitation-mcp"
Repository = "https://github.com/jsobel1/wikicitation-mcp"
"Bug Tracker" = "https://github.com/jsobel1/wikicitation-mcp/issues"
Documentation = "https://github.com/jsobel1/wikicitation-mcp#readme"

[project.scripts]
wikicitation-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: every top-level module the server imports must be listed here,
# otherwise the wheel installs but fails at import time.
[tool.hatch.build.targets.wheel]
include = [
    "server.py",
    "wiki_api.py",
    "citation_utils.py",
    "citation_templates.py",
    "annotate_utils.py",
    "progress.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "server.py",
    "wiki_api.py",
    "citation_utils.py",
    "citation_templates.py",
    "annotate_utils.py",
    "progress.py",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that call live public APIs (run with --run-integration)",
]

[tool.ruff]
line-length = 100
extend-exclude = ["paper", "scripts", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]
